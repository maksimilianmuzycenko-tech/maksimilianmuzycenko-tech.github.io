<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mermaid Графы | GCSOSIS mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0b1120;
            font-family: 'Segoe UI', system-ui, 'Fira Code', monospace;
            padding: 12px;
            min-height: 100vh;
        }
        /* единая карточка, адаптив */
        .mobile-app {
            max-width: 100%;
            background: #0f172a;
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid #2a3a60;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }
        /* тулбар — жирно, удобно */
        .toolbar {
            background: #0a0f1a;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1e2a48;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffb347, #ffdd88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #293856;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.8rem;
            color: white;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: inherit;
            min-height: 44px;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-render {
            background: #2c6e4f;
        }
        .btn-download {
            background: #1f5a7a;
        }
        .btn-example {
            background: #b45f1b;
        }
        /* основная сетка — под телефон */
        .flex-col {
            display: flex;
            flex-direction: column;
        }
        .editor-area {
            padding: 16px;
            background: #0b0f18;
            border-bottom: 1px solid #202a48;
        }
        .preview-area {
            padding: 20px 16px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        textarea {
            width: 100%;
            background: #01040e;
            color: #eef2ff;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.45;
            border: 1px solid #2a3d6a;
            border-radius: 28px;
            padding: 18px;
            resize: vertical;
            outline: none;
        }
        /* высота под экран, но удобно */
        #codeInput {
            min-height: 280px;
            max-height: 45vh;
        }
        .preview-card {
            background: #0f172a;
            border: 1px solid #2a3f68;
            border-radius: 32px;
            padding: 20px 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            min-height: 320px;
        }
        .diagram-holder svg {
            max-width: 100%;
            height: auto;
        }
        .status {
            margin-top: 14px;
            background: #0d1222;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #b9ceff;
            text-align: center;
            word-break: break-word;
        }
        .error-box {
            background: #2d1e1a;
            color: #ffaa77;
            padding: 18px;
            border-radius: 28px;
            text-align: center;
            width: 100%;
        }
        footer {
            background: #060a14;
            text-align: center;
            font-size: 10px;
            padding: 12px;
            color: #6c7ea0;
            border-top: 1px solid #1a253f;
        }
        /* всё крупное, пальцем удобно */
        button, textarea, .preview-card {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
<div class="mobile-app">
    <div class="toolbar">
        <div class="logo">✧ Mermaid · GCSOSIS</div>
        <div class="btn-group">
            <button id="renderBtn" class="btn-render">🖌️ Обновить</button>
            <button id="downloadBtn" class="btn-download">📸 PNG</button>
            <button id="exampleBtn" class="btn-example">✨ Пример</button>
        </div>
    </div>

    <div class="flex-col">
        <div class="editor-area">
            <textarea id="codeInput" spellcheck="false">graph TD;
    A[Проснулся] --> B[Поел];
    B --> D[Кодить];
    D --> G{Устал?};
    G -- Нет --> D;
    G -- Да --> J[Спать];
    D --> S{Баги?};
    S -- Есть --> E[Послать_всех];
    E --> J;
    J --> A;

    subgraph "Философия"
        R[💎 2 рубина] --> M[Монеты: Infinity];
        M --> N[null ultimate law largely];
    end</textarea>
        </div>
        <div class="preview-area">
            <div class="preview-card" id="previewCard">
                <div id="mermaidRender" class="diagram-holder" style="width:100%; text-align:center;">
                    🔄 Нажми «Обновить»
                </div>
            </div>
            <div id="statusMsg" class="status">⚡ Готов. Редактируй → Обновить. PNG сохранится.</div>
        </div>
    </div>
    <footer>📱 Пальцем удобно. PNG честно в /Downloads — скриншот области предпросмотра.</footer>
</div>

<script>
    (function() {
        // инициализация mermaid (без автозагрузки)
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                'background': '#0f172a',
                'primaryColor': '#ffb347',
                'primaryBorderColor': '#eab308',
                'primaryTextColor': '#fff0db',
                'lineColor': '#c4aeff',
                'secondaryColor': '#1f5780'
            },
            flowchart: { useMaxWidth: true, htmlLabels: true },
            securityLevel: 'loose'
        });

        const textarea = document.getElementById('codeInput');
        const renderTarget = document.getElementById('mermaidRender');
        const previewCardDiv = document.getElementById('previewCard');
        const statusDiv = document.getElementById('statusMsg');
        const renderBtn = document.getElementById('renderBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const exampleBtn = document.getElementById('exampleBtn');

        let currentOk = false;

        // Рендер диаграммы
        async function renderDiagram() {
            const code = textarea.value.trim();
            if (!code) {
                renderTarget.innerHTML = '<div class="error-box">❌ Пустой код. Введите Mermaid разметку.</div>';
                statusDiv.innerHTML = '❌ Пустая строка';
                currentOk = false;
                return;
            }

            statusDiv.innerHTML = '🌀 Генерация схемы...';
            renderTarget.innerHTML = '<div style="padding:18px; color:#bdd4ff;">⏳ Рендеринг...</div>';
            const uid = 'mob_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const tempDiv = document.createElement('div');
            tempDiv.id = uid;
            tempDiv.className = 'mermaid';
            tempDiv.textContent = code;
            renderTarget.innerHTML = '';
            renderTarget.appendChild(tempDiv);

            try {
                const { svg } = await mermaid.render(uid, code);
                renderTarget.innerHTML = svg;
                statusDiv.innerHTML = '✅ Диаграмма готова. Нажми «PNG» чтобы сохранить.';
                currentOk = true;
            } catch (err) {
                console.warn(err);
                renderTarget.innerHTML = `<div class="error-box">⚠️ Ошибка Mermaid:<br> ${err.message || 'синтаксическая ошибка'}<br><br>📌 Проверь стрелки, текст, скобки.</div>`;
                statusDiv.innerHTML = `❌ Ошибка: ${err.message || 'некорректный синтаксис'}`;
                currentOk = false;
            }
        }

        // Сохранение PNG (скриншот previewCard — области с картинкой)
        async function downloadPNG() {
            if (!currentOk) {
                statusDiv.innerHTML = '⚠️ Сначала нажми «Обновить» и добейся успешного рендера.';
                return;
            }
            const svgEl = renderTarget.querySelector('svg');
            if (!svgEl) {
                statusDiv.innerHTML = '❌ Нет SVG. Обнови схему заново.';
                return;
            }
            statusDiv.innerHTML = '📸 Делаем PNG, секунду...';
            try {
                // скриншотим карточку с диаграммой (previewCard), чтобы был красивый фон
                const canvas = await html2canvas(previewCardDiv, {
                    scale: 2.8,
                    backgroundColor: '#0f172a',
                    logging: false,
                    useCORS: false,
                    allowTaint: false
                });
                const link = document.createElement('a');
                const now = new Date();
                const stamp = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}_${now.getHours()}-${now.getMinutes()}`;
                link.download = `mermaid_gcsosis_${stamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                statusDiv.innerHTML = '✅ PNG сохранён в папку «Загрузки»!';
            } catch (err) {
                console.error(err);
                statusDiv.innerHTML = '❌ Ошибка сохранения: ' + (err.message || 'неизвестная');
            }
        }

        // Пример (твоя классика, жизнь разработчика)
        function setExample() {
            const exampleText = `graph TD;
    A[Проснулся] --> B[Поел];
    B --> D[Кодить];
    D --> G{Устал?};
    G -- Нет --> D;
    G -- Да --> J[Спать];
    D --> S{Баги?};
    S -- Есть --> E[Послать_всех];
    E --> J;
    J --> A;

    subgraph "Сакральный смысл"
        RUB[💎 2 рубина] --> INF[Монеты: Infinity];
        INF --> NULLLAW[null ultimate law largely];
    end`;
            textarea.value = exampleText;
            renderDiagram();
        }

        // События
        renderBtn.addEventListener('click', renderDiagram);
        downloadBtn.addEventListener('click', downloadPNG);
        exampleBtn.addEventListener('click', setExample);

        // при загрузке сразу рисуем начальный блок
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderDiagram, 30);
        });
    })();
</script>
</body>
</html>
