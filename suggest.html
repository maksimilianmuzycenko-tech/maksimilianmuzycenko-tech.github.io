<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предложить идею — Игры от Максима</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: Arial, sans-serif; line-height: 1.5; color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: #1a1a1a; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 10px; color: #ff5500; }
        .sub { text-align: center; margin-bottom: 30px; color: #aaa; font-size: 14px; }
        input, textarea { width: 100%; padding: 15px; border-radius: 16px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; margin-bottom: 20px; font-family: inherit; }
        textarea { resize: vertical; }
        button { background: #ff5500; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 40px; cursor: pointer; width: 100%; transition: 0.2s; font-weight: bold; }
        button:hover { background: #cc4400; transform: scale(1.02); }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #ff5500; text-decoration: none; }
        .status { margin-top: 15px; text-align: center; padding: 10px; border-radius: 12px; display: none; }
        .status.success { background: #1e3a1e; color: #8bc34a; display: block; }
        .status.error { background: #3a1e1e; color: #ff8888; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h1>💡 Предложить идею</h1>
    <div class="sub">Напиши, что бы ты хотел видеть в играх</div>
    
    <input type="text" id="userName" placeholder="Твоё имя (по желанию)">
    <textarea id="ideaText" rows="5" placeholder="Опиши свою идею..."></textarea>
    <button id="sendBtn">📨 Отправить предложение</button>
    
    <div id="statusMsg" class="status"></div>
    <div class="back-link"><a href="chat.html">← Вернуться в чат</a></div>
</div>

<script>
    const sendBtn = document.getElementById('sendBtn');
    const nameField = document.getElementById('userName');
    const ideaField = document.getElementById('ideaText');
    const statusDiv = document.getElementById('statusMsg');

    sendBtn.addEventListener('click', async () => {
        const userName = nameField.value.trim() || "Аноним";
        const idea = ideaField.value.trim();
        
        if (!idea) {
            statusDiv.className = 'status error';
            statusDiv.innerText = '❌ Напиши свою идею перед отправкой!';
            return;
        }

        sendBtn.disabled = true;
        statusDiv.className = 'status';
        statusDiv.innerText = '⏳ Отправляем...';

        try {
            // Используем AJAX-метод FormSubmit (работает через поддомен ajax)
            const response = await fetch('https://formsubmit.co/ajax/yaatomshik@mail.ru', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    _subject: `Новая идея от ${userName}`,
                    Имя: userName,
                    Идея: idea,
                    _captcha: 'false'
                })
            });

            if (response.ok) {
                statusDiv.className = 'status success';
                statusDiv.innerText = '✅ Спасибо! Твоё предложение ушло разработчику.';
                nameField.value = '';
                ideaField.value = '';
            } else {
                throw new Error('Ошибка отправки');
            }
        } catch (error) {
            statusDiv.className = 'status error';
            statusDiv.innerText = '❌ Не удалось отправить. Напиши на почту yaatomshik@mail.ru';
        } finally {
            sendBtn.disabled = false;
        }
    });
</script>
</body>
</html>
