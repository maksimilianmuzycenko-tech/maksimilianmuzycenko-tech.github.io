<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Предложить идею — Игры от Максима</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: Arial, sans-serif; color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; width: 100%; background: #1a1a1a; padding: 30px; border-radius: 24px; text-align: center; }
        h1 { color: #ff5500; margin-bottom: 20px; }
        p { margin: 20px 0; color: #aaa; line-height: 1.6; }
        .buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .btn { display: block; background: #ff5500; color: white; padding: 12px; border-radius: 40px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #cc4400; transform: scale(1.02); }
        .btn-back { background: #333; }
        .btn-back:hover { background: #444; }
    </style>
</head>
<body>
<div class="container">
    <h1>💡 Предложить идею</h1>
    <p>Напиши мне на почту — я обязательно рассмотрю твоё предложение!</p>
    
    <div class="buttons">
        <a href="mailto:yaatomshik@mail.ru?subject=Предложение%20по%20игре" class="btn">📧 Написать на почту</a>
        <a href="chat.html" class="btn btn-back">← Вернуться в чат</a>
    </div>
</div>
</body>
</html>
