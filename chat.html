<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Помощник — Игры от Максима</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #ff5500; color: white; padding: 14px 16px; font-size: 18px; font-weight: bold; text-align: center; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .close-chat { background: none; border: none; color: white; font-size: 26px; cursor: pointer; font-weight: bold; width: 40px; height: 40px; border-radius: 50%; }
        .close-chat:active { background: rgba(255,255,255,0.2); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #111; }
        .bot-message, .user-message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .bot-message { background: #222; color: #f0f0f0; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user-message { background: #ff5500; color: black; align-self: flex-end; border-bottom-right-radius: 4px; }
        .thinking { background: #222; color: #aaa; font-style: italic; padding: 10px 14px; border-radius: 18px; font-size: 13px; align-self: flex-start; }
        .search-box { background: #111; border-bottom: 1px solid #333; padding: 12px; flex-shrink: 0; }
        .search-box input { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #333; border-radius: 30px; outline: none; background: #222; color: #f0f0f0; }
        .search-box input::placeholder { color: #888; }
        .questions-panel { background: #111; border-top: 1px solid #333; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto; flex-shrink: 0; }
        .question-btn { background: #222; color: #f0f0f0; border: none; padding: 8px 14px; border-radius: 30px; font-size: 13px; cursor: pointer; text-align: left; flex: 1 0 auto; }
        .question-btn:active { background: #ff5500; color: black; }
        .footer-note { text-align: center; font-size: 10px; background: #111; padding: 6px; color: #888; border-top: 1px solid #222; flex-shrink: 0; }
        a { color: #ff5500; text-decoration: none; }
        @media (max-width: 480px) {
            .chat-header { padding: 10px 12px; font-size: 16px; }
            .bot-message, .user-message { max-width: 90%; font-size: 13px; padding: 8px 12px; }
            .question-btn { font-size: 12px; padding: 6px 12px; }
            .search-box input { font-size: 14px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="chat-header">
    🤖 Помощник «Игры от Максима»
    <button class="close-chat" id="exitChatBtn">✖</button>
</div>

<div class="chat-messages" id="chatMessages">
    <div class="bot-message">Привет! Я помощник. Выбери вопрос ниже или начни печатать.</div>
</div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Начни печатать вопрос...">
</div>

<div class="questions-panel" id="questionsPanel"></div>

<div class="footer-note">Поддержка работает 24/7</div>

<script>
    const messages = document.getElementById('chatMessages');
    const exitBtn = document.getElementById('exitChatBtn');
    const searchInput = document.getElementById('searchInput');
    const questionsPanel = document.getElementById('questionsPanel');

    const questionsData = [
        { text: "📱 Где скачать игры?", handler: "download" },
        { text: "📢 Дай ссылку на ВК", handler: "vk" },
        { text: "🐙 Дай ссылку на GitHub", handler: "github" },
        { text: "🛠️ Перенаправь к службе поддержки", handler: "support" },
        { text: "🚪 Выйти из чата", handler: "exit" },
        { text: "🎮 Описание «Бесконечный кликер»", handler: "descClicker" },
        { text: "🏢 Описание «My Business»", handler: "descBusiness" },
        { text: "⛏️ Описание «Симулятор добычи»", handler: "descMiner" },
        { text: "🚀 Будет ли компания развиваться?", handler: "future" },
        { text: "📜 Лицензионное соглашение", handler: "licenseText" },
        { text: "🧠 Объясни лицензию простыми словами", handler: "licenseExplain" },
        { text: "👥 Сколько человек в компании?", handler: "teamSize" },
        { text: "❓ Почему сайт стал чёрным?", handler: "blackTheme" },
        { text: "📆 Что будет в следующем обновлении?", handler: "nextUpdate" },
        { text: "🍏 Игра появится на iOS?", handler: "iosQuestion" },
        { text: "📲 Как связаться с разработчиком кроме почты?", handler: "contactOther" },
        { text: "📊 Сколько весит сайт?", handler: "siteWeight" },
        { text: "❓ Почему вы перешли на другую платформу?", handler: "whyMigrate" },
        { text: "📦 Сколько весят игры в магазине и после установки?", handler: "gameSize" }
    ];

    function addBotMessage(text, isHtml = false) {
        const div = document.createElement('div');
        div.className = 'bot-message';
        if (isHtml) div.innerHTML = text;
        else div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'user-message';
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function showThinking() {
        const div = document.createElement('div');
        div.className = 'thinking';
        div.textContent = '🤔 1 секунда...';
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    function removeThinking(div) {
        if (div && div.remove) div.remove();
    }

    const answers = {
        download: () => {
            addUserMessage('Где скачать игры?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Скачать можно в RuStore:<br>🔹 <a href="https://www.rustore.ru/catalog/app/appinventor.ai_maksimilianmuzycenko.klikerV" target="_blank">Бесконечный кликер</a><br>🔹 <a href="https://www.rustore.ru/catalog/app/appinventor.ai_maksimilianmuzycenko.BOSSINVEST" target="_blank">My Business</a><br>🔹 <a href="https://www.rustore.ru/catalog/app/appinventor.ai_maksimilianmuzycenko.energyboss" target="_blank">Симулятор добычи</a>`, true);
            }, 1000);
        },
        vk: () => {
            addUserMessage('Дай ссылку на ВК');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage('📢 Сообщество ВКонтакте: <a href="https://vk.com/mygameatom" target="_blank">https://vk.com/mygameatom</a>', true);
            }, 1000);
        },
        github: () => {
            addUserMessage('Дай ссылку на GitHub');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage('🐙 Профиль GitHub: <a href="https://github.com/maksimilianmuzycenko-tech" target="_blank">github.com/maksimilianmuzycenko-tech</a>', true);
            }, 1000);
        },
        support: () => {
            addUserMessage('Перенаправь к службе поддержки');
            const t1 = showThinking();
            setTimeout(() => {
                removeThinking(t1);
                addBotMessage('Соединяю со службой поддержки...');
                const t2 = showThinking();
                setTimeout(() => {
                    removeThinking(t2);
                    window.location.href = 'mailto:yaatomshik@mail.ru?subject=Вопрос%20по%20игре';
                }, 1000);
            }, 1000);
        },
        exit: () => {
            addUserMessage('Выйти из чата');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage('Возвращаемся на главную страницу...');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }, 1000);
        },
        descClicker: () => {
            addUserMessage('Описание «Бесконечный кликер»');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`💰 Кликай и зарабатывай очки.<br>⚡ Улучшай силу клика.<br>🤖 Автокликер — твой помощник.<br>🎁 Бонусы каждые 5 минут и 100 кликов.<br>💎 Древо рубинов.<br>🏆 Достижения.<br>💾 Автосохранение.<br>🎮 Промокод: novichokrusturekliker`, true);
            }, 1000);
        },
        descBusiness: () => {
            addUserMessage('Описание «My Business»');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`🏢 Ты Босс!<br>💰 Налоги каждые 35 секунд, доход каждые 5 секунд.<br>🎁 Бонусы: каждые 15 минут +1 алмаз, 30 минут +1 рубин.<br>💎 Бесплатный премиум‑магазин.<br>⚡ Супер‑дни — увольняй рабочих с возвратом 50% стоимости найма.<br>🎮 Промокод: novichok`, true);
            }, 1000);
        },
        descMiner: () => {
            addUserMessage('Описание «Симулятор добычи»');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`⛏️ Добывай 4 вида ресурсов.<br>📈 Продавай, пока цена высокая.<br>🔧 Улучшай силу добычи.<br>💾 Автосохранение.`, true);
            }, 1000);
        },
        future: () => {
            addUserMessage('Будет ли компания развиваться?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Да! В планах: свой сервер, таблица лидеров, ежедневные события, переход на Godot, а может, даже создание новой игры. Компания будет расти и радовать игроков.`);
            }, 1000);
        },
        licenseText: () => {
            addUserMessage('Какое лицензионное соглашение?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Полный текст лицензии можно прочитать на главной странице сайта в блоке «Лицензионное соглашение».`);
            }, 1000);
        },
        licenseExplain: () => {
            addUserMessage('Объясни лицензию простыми словами');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Простыми словами: ты можешь скачать и играть бесплатно. Нельзя продавать игру, выдавать её за свою или перевыкладывать без спроса. Если что‑то сломалось — мы не несём ответственности, но постараемся всё починить.`);
            }, 1000);
        },
        teamSize: () => {
            addUserMessage('Сколько человек в компании?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`В компании 1 человек. Но он ОЧЕНЬ трудолюбивый и преданный своему делу. За 1,5 месяца выпущено 3 игры!`);
            }, 1000);
        },
        blackTheme: () => {
            addUserMessage('Почему сайт стал чёрным?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Мы обновили дизайн — теперь сайт выглядит современно и стильно, чтобы игры было приятнее смотреть. Плюс экономит батарею на OLED-экранах!`);
            }, 1000);
        },
        nextUpdate: () => {
            addUserMessage('Что будет в следующем обновлении?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Скоро: таблица лидеров, свой сервер, ещё больше бонусов и, возможно, многопользовательский режим!`);
            }, 1000);
        },
        iosQuestion: () => {
            addUserMessage('Игра появится на iOS?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Пока в планах нет, но если наберём много запросов — подумаем. Следи за новостями в VK!`);
            }, 1000);
        },
        contactOther: () => {
            addUserMessage('Как связаться с разработчиком кроме почты?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Пиши в сообщество VK: <a href="https://vk.com/mygameatom" target="_blank">https://vk.com/mygameatom</a> — я отвечаю быстро!`, true);
            }, 1000);
        },
        siteWeight: () => {
            addUserMessage('Сколько весит сайт?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Весь сайт весит чуть больше 1 МБ, а одна страница — около 10-12 КБ. Это очень мало, поэтому сайт летает даже на медленном интернете!`);
            }, 1000);
        },
        whyMigrate: () => {
            addUserMessage('Почему вы перешли на другую платформу?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`Раньше сайт был на Tilda, но бесплатная версия не позволяла вставлять свой HTML-код (например, для чат‑бота и кастомных виджетов). GitHub Pages дал полную свободу и 100% контроль над кодом, плюс это отличный опыт для портфолио разработчика.`);
            }, 1000);
        },
        gameSize: () => {
            addUserMessage('Сколько весят игры в магазине и после установки?');
            const t = showThinking();
            setTimeout(() => {
                removeThinking(t);
                addBotMessage(`В RuStore игровой файл (.apk/.aab) весит всего около 5 МБ. После установки на телефон игра «распаковывается» и может занимать примерно 20 МБ — это связано с оптимизацией и работой ресурсов.`);
            }, 1000);
        }
    };

    function renderButtons(filterText = '') {
        questionsPanel.innerHTML = '';
        const filtered = questionsData.filter(q => q.text.toLowerCase().includes(filterText.toLowerCase()));
        if (filtered.length === 0) {
            const msg = document.createElement('div');
            msg.style.padding = '10px';
            msg.style.textAlign = 'center';
            msg.style.color = '#888';
            msg.innerText = '❓ Ничего не найдено. Попробуй другие буквы.';
            questionsPanel.appendChild(msg);
            return;
        }
        filtered.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'question-btn';
            btn.textContent = q.text;
            btn.addEventListener('click', () => {
                const handler = answers[q.handler];
                if (handler) handler();
            });
            questionsPanel.appendChild(btn);
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderButtons(e.target.value);
    });

    renderButtons();

    exitBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
