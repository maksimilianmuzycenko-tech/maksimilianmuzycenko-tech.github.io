<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Помощник — Игры от Максима</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: #f5f5f5;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #ff5500;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #ffffff;
        }
        .bot-message, .user-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.2s ease;
        }
        .bot-message {
            background: #f1f1f1;
            color: #111;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background: #ff5500;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .thinking {
            background: #f1f1f1;
            color: #888;
            font-style: italic;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            align-self: flex-start;
        }
        .questions-panel {
            background: white;
            border-top: 1px solid #ddd;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px;
        }
        .question-btn {
            background: #f1f1f1;
            border: none;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        .question-btn:hover {
            background: #ff5500;
            color: white;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            background: #f9f9f9;
            padding: 8px;
            color: #aaa;
            border-top: 1px solid #efefef;
        }
        a {
            color: #ff5500;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        🤖 Помощник «Игры от Максима»
        <button class="close-chat" id="exitChatBtn">✖</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="bot-message">Привет! Я помощник. Выбери один из вопросов ниже.</div>
    </div>
    <div class="questions-panel" id="questionsPanel">
        <button class="question-btn" data-question="download">📱 Где скачать игры?</button>
        <button class="question-btn" data-question="vk">📢 Дай ссылку на ВК</button>
        <button class="question-btn" data-question="github">🐙 Дай ссылку на GitHub</button>
        <button class="question-btn" data-question="support">🛠️ Перенаправь к службе поддержки</button>
        <button class="question-btn" data-question="exit">🚪 Выйти из чата</button>
    </div>
    <div class="footer-note">
        Поддержка работает 24/7
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('chatMessages');
    const exitBtn = document.getElementById('exitChatBtn');

    function addBotMessage(text, isHtml = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'bot-message';
        if (isHtml) {
            msgDiv.innerHTML = text;
        } else {
            msgDiv.textContent = text;
        }
        messagesContainer.appendChild(msgDiv);
        scrollToBottom();
    }

    function addUserMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'user-message';
        msgDiv.textContent = text;
        messagesContainer.appendChild(msgDiv);
        scrollToBottom();
    }

    function showThinking() {
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'thinking';
        thinkingDiv.id = 'thinkingMsg';
        thinkingDiv.textContent = '🤔 Печатает...';
        messagesContainer.appendChild(thinkingDiv);
        scrollToBottom();
        return thinkingDiv;
    }

    function removeThinking(thinkingDiv) {
        if (thinkingDiv && thinkingDiv.remove) thinkingDiv.remove();
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleQuestion(questionType) {
        switch (questionType) {
            case 'download':
                addUserMessage('Где скачать игры?');
                const t1 = showThinking();
                setTimeout(() => {
                    removeThinking(t1);
                    addBotMessage(`Скачать можно в RuStore:<br>
                        🔹 <a href="https://www.rustore.ru/catalog/app/appinventor.ai_maksimilianmuzycenko.klikerV" target="_blank">Бесконечный кликер</a><br>
                        🔹 <a href="https://www.rustore.ru/catalog/app/appinventor.ai_maksimilianmuzycenko.BOSSINVEST" target="_blank">My Business: Строй Империю</a><br>
                        🔹 <a href="https://www.rustore.ru/catalog/app/appinventor.ai_maksimilianmuzycenko.energyboss" target="_blank">Симулятор добычи</a>`, true);
                }, 2000);
                break;

            case 'vk':
                addUserMessage('Дай ссылку на ВК');
                const t2 = showThinking();
                setTimeout(() => {
                    removeThinking(t2);
                    addBotMessage('📢 Сообщество ВКонтакте: <a href="https://vk.com/mygameatom" target="_blank">https://vk.com/mygameatom</a>', true);
                }, 2000);
                break;

            case 'github':
                addUserMessage('Дай ссылку на GitHub');
                const t3 = showThinking();
                setTimeout(() => {
                    removeThinking(t3);
                    addBotMessage('🐙 Профиль GitHub: <a href="https://github.com/maksimilianmuzycenko-tech" target="_blank">github.com/maksimilianmuzycenko-tech</a>', true);
                }, 2000);
                break;

            case 'support':
                addUserMessage('Перенаправь к службе поддержки');
                const t4 = showThinking();
                setTimeout(() => {
                    removeThinking(t4);
                    addBotMessage('Соединяю со службой поддержки...');
                    const t5 = showThinking();
                    setTimeout(() => {
                        removeThinking(t5);
                        addBotMessage('Напишите нам на почту: <a href="mailto:yaatomshik@mail.ru">yaatomshik@mail.ru</a><br>Мы ответим в ближайшее время.', true);
                    }, 1000);
                }, 2000);
                break;

            case 'exit':
                addUserMessage('Выйти из чата');
                const t6 = showThinking();
                setTimeout(() => {
                    removeThinking(t6);
                    addBotMessage('Возвращаемся на главную страницу...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }, 1000);
                break;

            default:
                addUserMessage('Неизвестный запрос');
                addBotMessage('Извините, я не понял вопрос. Попробуйте выбрать другой вариант.');
                break;
        }
    }

    document.querySelectorAll('.question-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const qType = btn.getAttribute('data-question');
            handleQuestion(qType);
        });
    });

    exitBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
