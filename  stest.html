<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Степени двойки</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 420px;
  }
  h1 { font-size: 22px; text-align: center; color: #333; }
  .progress { text-align: center; color: #888; margin-bottom: 15px; }
  .question {
    font-size: 26px;
    text-align: center;
    margin: 20px 0 25px;
    color: #1a73e8;
    font-weight: bold;
  }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  button.answer {
    padding: 12px;
    font-size: 16px;
    border: 2px solid #1a73e8;
    background: white;
    color: #1a73e8;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  button.answer:hover:not(:disabled) {
    background: #1a73e8;
    color: white;
  }
  button.answer:disabled { cursor: default; }
  button.correct { background: #34a853; color: white; border-color: #34a853; }
  button.wrong { background: #ea4335; color: white; border-color: #ea4335; }
  .result {
    text-align: center;
    font-size: 20px;
    margin-top: 20px;
    font-weight: bold;
  }
  .grade {
    font-size: 60px;
    color: #1a73e8;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Проверка: степени двойки 0–11</h1>
  <div class="progress" id="progress"></div>
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
  <div class="result" id="result"></div>
</div>

<script>
  // Все данные хранятся в массиве
  const questions = [
    { q: "2⁰ = ?", correct: 1, options: [1, 2, 0, 4, 8] },
    { q: "2¹ = ?", correct: 2, options: [1, 2, 3, 4, 0] },
    { q: "2² = ?", correct: 4, options: [2, 4, 6, 8, 16] },
    { q: "2³ = ?", correct: 8, options: [6, 8, 12, 16, 4] },
    { q: "2⁴ = ?", correct: 16, options: [8, 16, 24, 32, 12] },
    { q: "2⁵ = ?", correct: 32, options: [24, 32, 64, 16, 48] },
    { q: "2⁶ = ?", correct: 64, options: [32, 64, 128, 96, 72] },
    { q: "2⁷ = ?", correct: 128, options: [64, 128, 256, 112, 144] },
    { q: "2⁸ = ?", correct: 256, options: [128, 256, 512, 384, 216] },
    { q: "2⁹ = ?", correct: 512, options: [256, 512, 1024, 768, 448] },
    { q: "2¹⁰ = ?", correct: 1024, options: [512, 1024, 2048, 1536, 896] },
    { q: "2¹¹ = ?", correct: 2048, options: [1024, 2048, 4096, 3072, 1792] }
  ];

  const TOTAL_QUESTIONS = 5;
  let askedIndexes = [];     // какие вопросы уже были
  let current = 0;           // номер текущего вопроса (0..4)
  let score = 0;             // правильные ответы
  let currentQuestion = null;
  let answered = false;

  const questionEl = document.getElementById('question');
  const answersEl = document.getElementById('answers');
  const progressEl = document.getElementById('progress');
  const resultEl = document.getElementById('result');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickQuestion() {
    // выбираем случайный вопрос, который ещё не задавали
    const available = questions
      .map((_, i) => i)
      .filter(i => !askedIndexes.includes(i));
    const idx = available[Math.floor(Math.random() * available.length)];
    askedIndexes.push(idx);
    return questions[idx];
  }

  function showQuestion() {
    answered = false;
    resultEl.textContent = '';
    progressEl.textContent = `Вопрос ${current + 1} из ${TOTAL_QUESTIONS}`;
    currentQuestion = pickQuestion();
    questionEl.textContent = currentQuestion.q;

    answersEl.innerHTML = '';
    const shuffledOptions = shuffle(currentQuestion.options);
    shuffledOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'answer';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleAnswer(btn, opt));
      answersEl.appendChild(btn);
    });
  }

  function handleAnswer(btn, value) {
    if (answered) return;
    answered = true;

    const buttons = answersEl.querySelectorAll('button');
    buttons.forEach(b => {
      b.disabled = true;
      if (Number(b.textContent) === currentQuestion.correct) {
        b.classList.add('correct');
      }
    });

    if (value === currentQuestion.correct) {
      score++;
    } else {
      btn.classList.add('wrong');
    }

    setTimeout(() => {
      current++;
      if (current < TOTAL_QUESTIONS) {
        showQuestion();
      } else {
        finish();
      }
    }, 900);
  }

  function finish() {
    progressEl.textContent = '';
    questionEl.textContent = 'Готово!';
    answersEl.innerHTML = '';

    let grade;
    if (score <= 2) grade = 2;
    else if (score === 3) grade = 3;
    else if (score === 4) grade = 4;
    else grade = 5;

    resultEl.innerHTML = `Правильных ответов: ${score} из ${TOTAL_QUESTIONS}`;
    const g = document.createElement('div');
    g.className = 'grade';
    g.textContent = `Оценка: ${grade}`;
    resultEl.appendChild(g);
  }

  // старт
  showQuestion();
</script>
</body>
</html>
