<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MaxBrowser — Безумный учёный</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f1e;
            font-family: 'Segoe UI', 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Панель браузера */
        .browser-bar {
            background: #1e1e2f;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #f5bc70;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .logo {
            font-weight: bold;
            background: #f5bc70;
            color: #1e1e2f;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .address-bar {
            flex: 1;
            display: flex;
            gap: 8px;
            background: #2a2a3c;
            border-radius: 50px;
            padding: 5px 15px;
            align-items: center;
        }
        .address-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
        }
        .address-bar input::placeholder {
            color: #aaa;
        }
        .address-bar button {
            background: #f5bc70;
            border: none;
            padding: 5px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .address-bar button:active {
            transform: scale(0.96);
        }
        /* Боковые ссылки */
        .quick-links {
            display: flex;
            gap: 20px;
            background: #252537;
            padding: 8px 20px;
            border-bottom: 1px solid #333;
            overflow-x: auto;
        }
        .quick-links a {
            color: #ffdd99;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .quick-links a:hover {
            text-decoration: underline;
        }
        /* iframe — как вкладка браузера */
        .browser-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }
        footer {
            background: #11111c;
            padding: 5px;
            text-align: center;
            font-size: 0.65rem;
            color: #aaa;
            border-top: 1px solid #2a2a3c;
        }
    </style>
</head>
<body>

<div class="browser-bar">
    <div class="logo">🧠 MaxBrowser</div>
    <div class="address-bar">
        <input type="text" id="searchInput" placeholder="Поиск в Яндексе или введи ссылку..." value="https://ya.ru">
        <button id="goBtn">🚀 Летим</button>
    </div>
</div>

<div class="quick-links">
    <a href="#" data-url="https://ya.ru">🔍 Яндекс</a>
    <a href="#" data-url="https://maksimilianmuzycenko-tech.github.io">🌐 Твой сайт</a>
    <a href="#" data-url="https://github.com">🐙 GitHub</a>
    <a href="#" data-url="https://www.rustore.ru/catalog/developer/fdq1kz">📦 RuStore</a>
    <a href="#" data-url="https://yandex.ru/games">🎮 Яндекс Игры</a>
</div>

<iframe id="browserFrame" class="browser-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>

<footer>
    ⚡ Безумная лаборатория Game Command Studio | Браузер в браузере | Поисковик: Яндекс
</footer>

<script>
    const frame = document.getElementById('browserFrame');
    const searchInput = document.getElementById('searchInput');
    const goBtn = document.getElementById('goBtn');

    // Функция навигации
    function navigateTo(url) {
        if (!url) return;
        // Если это не ссылка (нет http), то ищем через Яндекс
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            // Проверяем, похоже на сайт (содержит точку и нет пробелов)
            if (url.includes('.') && !url.includes(' ')) {
                url = 'https://' + url;
            } else {
                // Поисковый запрос → Яндекс
                url = 'https://yandex.ru/search/?text=' + encodeURIComponent(url);
            }
        }
        frame.src = url;
        searchInput.value = url;
    }

    // Обработчик кнопки "Летим"
    goBtn.addEventListener('click', () => {
        navigateTo(searchInput.value);
    });

    // Обработчик Enter в поле ввода
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            navigateTo(searchInput.value);
        }
    });

    // Быстрые ссылки
    document.querySelectorAll('.quick-links a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const url = link.getAttribute('data-url');
            if (url) {
                navigateTo(url);
            }
        });
    });

    // Открываем Яндекс по умолчанию
    navigateTo('https://ya.ru');
</script>
</body>
</html>
