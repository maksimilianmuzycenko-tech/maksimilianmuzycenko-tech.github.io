<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GCS — Уроки</title>
    <style>
        * { margin: 0 auto; padding: 5px; box-sizing: border-box; }
        body { background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%); font-family: system-ui, sans-serif; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #5600FF; padding-bottom: 10px; }
        .user-info { background: #ffffff; padding: 20px; border-radius: 30px; border: 5px solid #5600FF; margin-bottom: 30px; text-align: center; }
        .user-info p { margin: 8px 0; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        .cards-grid { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; margin-top: 20px; }
        .card { background: #fff; width: 220px; height: 220px; border-radius: 30px; border: 5px solid #5600FF; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.05); background: #f5f5ff; }
        .card.locked { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.2); }
        .card.locked:hover { transform: none; background: #fff; }
        .card.win { background: #d4ffd4; border-color: #00aa00; }
        .card-title { font-size: 22px; font-weight: bold; color: #5600FF; }
        .card-status { font-size: 16px; margin-top: 10px; }
        button { background: #5600FF; color: white; font-weight: bold; padding: 8px 18px; border: none; border-radius: 40px; cursor: pointer; }
        button:hover { background: #3c00b3; transform: scale(1.02); }
        .logout-btn { background: #ff4444; }
        .logout-btn:hover { background: #cc0000; }
        .export-btn { background: #00aa66; }
        .export-btn:hover { background: #008844; }
        .back-link { display: inline-block; margin-top: 30px; color: #5600FF; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>📚 Твои уроки</h1></div>
    <div class="user-info" id="userInfo">⚡ Загрузка...</div>
    <div class="cards-grid" id="cardsGrid"></div>
    <a href="https://maksimilianmuzycenko-tech.github.io/itfreegcs/index.html" class="back-link">← На главную сайта</a>
</div>
<script>
    const BASE = 'https://maksimilianmuzycenko-tech.github.io/itfreegcs/';
    
    // Эталонная структура (то, что должно быть)
    const DEFAULT_CARDS = { card1: "no", card2: "no", card3: "no", card4: "no", card5: "no" };
    const DEFAULT_STEPS = { card1h1: "no" };
    const DEFAULT_PROGRESS = { user: "Гость", points: 0, cards: DEFAULT_CARDS, steps: DEFAULT_STEPS };

    function loadUser() {
        const raw = sessionStorage.getItem('gcs_user');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    // Функция, которая дополняет прогресс до правильной структуры
    function normalizeProgress(progress) {
        if (!progress) return JSON.parse(JSON.stringify(DEFAULT_PROGRESS));
        
        let updated = false;
        
        // Дополняем карточки
        for (let key of Object.keys(DEFAULT_CARDS)) {
            if (!progress.cards || progress.cards[key] === undefined) {
                if (!progress.cards) progress.cards = {};
                progress.cards[key] = DEFAULT_CARDS[key];
                updated = true;
            }
        }
        
        // Дополняем шаги
        for (let key of Object.keys(DEFAULT_STEPS)) {
            if (!progress.steps || progress.steps[key] === undefined) {
                if (!progress.steps) progress.steps = {};
                progress.steps[key] = DEFAULT_STEPS[key];
                updated = true;
            }
        }
        
        // Проверяем points
        if (progress.points === undefined) {
            progress.points = 0;
            updated = true;
        }
        
        // Проверяем user
        if (!progress.user) {
            const user = loadUser();
            progress.user = user?.user || "Гость";
            updated = true;
        }
        
        if (updated) {
            sessionStorage.setItem('gcs_progress', JSON.stringify(progress));
        }
        
        return progress;
    }

    function loadProgress() {
        let prog = sessionStorage.getItem('gcs_progress');
        let progress;
        
        if (!prog) {
            const user = loadUser();
            progress = JSON.parse(JSON.stringify(DEFAULT_PROGRESS));
            if (user) progress.user = user.user;
            sessionStorage.setItem('gcs_progress', JSON.stringify(progress));
        } else {
            try {
                progress = JSON.parse(prog);
            } catch(e) {
                progress = JSON.parse(JSON.stringify(DEFAULT_PROGRESS));
            }
        }
        
        // Применяем нормализацию (дополняем недостающие поля)
        progress = normalizeProgress(progress);
        return progress;
    }

    function exportProgress() {
        const progress = loadProgress();
        const jsonStr = JSON.stringify(progress, null, 2);
        navigator.clipboard.writeText(jsonStr).then(() => {
            alert('✅ JSON прогресса скопирован в буфер обмена! Сохрани его в надёжном месте.');
        }).catch(() => {
            alert('❌ Не удалось скопировать. Попробуй вручную.');
        });
    }

    function render() {
        const user = loadUser();
        if (!user) { window.location.href = BASE + 'vhod.html'; return; }
        const progress = loadProgress();
        
        const userInfoDiv = document.getElementById('userInfo');
        userInfoDiv.innerHTML = `
            <p>👤 <strong>${escapeHtml(progress.user)}</strong></p>
            <div class="info-row">
                <span>⭐ Баллы: <strong>${progress.points || 0}</strong></span>
                <button id="exportBtn" class="export-btn">📤 Экспорт прогресса</button>
                <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
            </div>
        `;
        
        document.getElementById('exportBtn')?.addEventListener('click', exportProgress);
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            sessionStorage.removeItem('gcs_user');
            sessionStorage.removeItem('gcs_progress');
            window.location.href = BASE + 'vhod.html';
        });

        const cards = [
            { id: 'card1', name: 'Начало', link: 'card1h1.html' },
            { id: 'card2', name: 'Урок 2', link: 'card2.html' },
            { id: 'card3', name: 'Урок 3', link: 'card3.html' },
            { id: 'card4', name: 'Урок 4', link: 'card4.html' },
            { id: 'card5', name: 'Урок 5', link: 'card5.html' }
        ];
        
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        
        cards.forEach((card, idx) => {
            const available = idx === 0 || progress.cards[`card${idx}`] === 'win';
            const isWin = progress.cards[card.id] === 'win';
            const div = document.createElement('div');
            div.className = `card ${!available ? 'locked' : ''} ${isWin ? 'win' : ''}`;
            if (available && !isWin) div.addEventListener('click', () => window.location.href = BASE + card.link);
            let status = '';
            if (!available) status = '🔒 Заблокирован';
            else if (isWin) status = '✅ Пройдено';
            else status = '📖 Доступен';
            div.innerHTML = `<div class="card-title">${card.name}</div><div class="card-status">${status}</div>`;
            grid.appendChild(div);
        });
    }

    function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    render();
</script>
</body>
</html>
