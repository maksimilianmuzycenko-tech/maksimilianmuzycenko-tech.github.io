<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS — Урок 5: PEP8</title>
    <style>
        * { margin: 0 auto; padding: 5px; box-sizing: border-box; }
        body { background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%); font-family: system-ui, sans-serif; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #5600FF; padding-bottom: 10px; margin-bottom: 20px; }
        .content { background: #ffffff; padding: 30px; border-radius: 30px; border: 5px solid #5600FF; }
        button { background: #5600FF; color: white; font-weight: bold; padding: 12px 24px; border: none; border-radius: 40px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        button:hover { transform: scale(1.02); background: #3c00b3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .completed { color: green; font-weight: bold; margin-top: 15px; }
        .lessons-link { display: inline-block; margin-top: 20px; color: #5600FF; font-weight: bold; text-decoration: none; }
        hr { margin: 20px 0; border-color: #5600FF; }
        .code-block { background: #1e1e2f; color: #AEFF00; font-family: monospace; padding: 15px; border-radius: 20px; margin: 15px 0; white-space: pre-wrap; font-size: 14px; }
        .bad-code { background: #2a1e1e; border-left: 4px solid #ff4444; }
        .good-code { background: #1e2a1e; border-left: 4px solid #00aa66; }
        .tip { background: #e6e6ff; padding: 10px; border-radius: 15px; margin: 10px 0; color: #330066; }
        input { width: 100%; padding: 10px; border-radius: 20px; border: 2px solid #5600FF; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>📖 Урок 5: PEP8 — Стандарт кода</h1></div>
    <div class="content" id="contentArea">
        <p>⚡ Загрузка...</p>
    </div>
</div>
<script>
    const BASE = 'https://maksimilianmuzycenko-tech.github.io/itfreegcs/';

    function loadUser() {
        const raw = sessionStorage.getItem('gcs_user');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    function loadProgress() {
        const raw = sessionStorage.getItem('gcs_progress');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    function saveProgress(progress) {
        sessionStorage.setItem('gcs_progress', JSON.stringify(progress));
    }

    function render() {
        const user = loadUser();
        if (!user) {
            window.location.href = BASE + 'vhod.html';
            return;
        }
        let progress = loadProgress();
        if (!progress) return;

        const userName = user.user || 'Гость';
        const stepDone = progress.steps?.card5h1 === 'yes';
        const cardWin = progress.cards?.card5 === 'win';

        const contentDiv = document.getElementById('contentArea');

        if (stepDone && cardWin) {
            contentDiv.innerHTML = `
                <p>👋 Привет, <strong>${escapeHtml(userName)}</strong>!</p>
                <p>🎉 Поздравляю! Ты прошёл урок 5 и узнал о стандарте PEP8.</p>
                <p>Теперь твой код будет чище и понятнее другим разработчикам.</p>
                <hr>
                <a href="${BASE}lessons.html" class="lessons-link">← Вернуться к урокам</a>
            `;
            return;
        }

        contentDiv.innerHTML = `
            <p>👋 Привет, <strong>${escapeHtml(userName)}</strong>!</p>
            
            <p><strong>📌 Что такое PEP8?</strong></p>
            <p>PEP8 — это документ с правилами оформления кода на Python. Он помогает писать код так, чтобы его было легко читать другим разработчикам.</p>
            
            <p><strong>🔧 Основные правила:</strong></p>
            <ul style="margin-left: 20px; line-height: 1.6;">
                <li>Используй <strong>4 пробела</strong> для отступов (не табуляцию!)</li>
                <li>Максимальная длина строки — <strong>79 символов</strong></li>
                <li>Имена переменных и функций — <strong>строчные с подчёркиваниями</strong> (например: <code>user_name</code>)</li>
                <li>Имена классов — <strong>CapWords</strong> (например: <code>UserProfile</code>)</li>
                <li>Пробелы после запятых: <code>func(a, b, c)</code></li>
                <li>Пустые строки для разделения блоков кода</li>
            </ul>
            
            <div class="tip">
                💡 <strong>Совет:</strong> Установи расширение <strong>Pylint</strong> или <strong>Flake8</strong> в VS Code — они сами подсвечивают ошибки PEP8!
            </div>
            
            <hr>
            
            <p><strong>🎯 Задание: найди 3 ошибки PEP8 в этом коде:</strong></p>
            
            <div class="code-block bad-code">
def  badFunction():<br>
&nbsp;&nbsp;print("Hello")<br>
&nbsp;&nbsp;x=5<br>
&nbsp;&nbsp;y=10<br>
&nbsp;&nbsp;result=x+y<br>
&nbsp;&nbsp;return result
            </div>
            
            <p>Напиши, какие ошибки ты видишь (перечисли через запятую):</p>
            <input type="text" id="answerInput" placeholder="например: отступы, пробелы, имя функции" style="width:100%; padding:12px; border-radius:30px; border:2px solid #5600FF;">
            
            <button id="submitBtn">✅ Проверить</button>
            <div id="resultMsg"></div>
        `;

        const submitBtn = document.getElementById('submitBtn');
        const answerInput = document.getElementById('answerInput');
        const resultMsg = document.getElementById('resultMsg');

        // Правильные ответы (можно указать любые из списка)
        const possibleErrors = [
            "имя функции", "название функции", "badfunction", "стиль имени", "CamelCase",
            "пробелы", "отступы", "x=5", "y=10", "пробелы вокруг =", "лишние пробелы",
            "слишком много отступов", "пробел перед функцией", "лишний пробел"
        ];

        function checkAnswer(answer) {
            const lowerAnswer = answer.toLowerCase();
            // Ищем совпадения
            let found = [];
            for (let err of possibleErrors) {
                if (lowerAnswer.includes(err.toLowerCase())) {
                    found.push(err);
                }
            }
            // Убираем дубликаты
            found = [...new Set(found)];
            return found.length >= 2; // достаточно найти 2-3 ошибки из списка
        }

        submitBtn.addEventListener('click', () => {
            const answer = answerInput.value.trim();
            if (!answer) {
                resultMsg.innerHTML = '<p style="color:red;">❌ Введи ответ!</p>';
                return;
            }
            
            const isCorrect = checkAnswer(answer);
            
            if (isCorrect) {
                if (!progress.steps) progress.steps = {};
                if (!progress.cards) progress.cards = {};
                
                progress.steps.card5h1 = 'yes';
                progress.cards.card5 = 'win';
                progress.points = (progress.points || 0) + 1;
                
                saveProgress(progress);
                
                resultMsg.innerHTML = `
                    <p class="completed">✅ Правильно! Ты нашёл ошибки: лишние пробелы, отсутствие пробелов вокруг =, имя функции должно быть snake_case. +1 балл!</p>
                    <a href="${BASE}lessons.html" class="lessons-link">📚 Перейти к урокам →</a>
                `;
                submitBtn.disabled = true;
                answerInput.disabled = true;
            } else {
                resultMsg.innerHTML = '<p style="color:red;">❌ Не все ошибки найдены. Попробуй ещё раз! (Подсказка: посмотри на пробелы и имя функции)</p>';
            }
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    render();
</script>
</body>
</html>
