<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS — Урок 4: Python. Шаг 2</title>
    <style>
        * { margin: 0 auto; padding: 5px; box-sizing: border-box; }
        body { background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%); font-family: system-ui, sans-serif; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #5600FF; padding-bottom: 10px; margin-bottom: 20px; }
        .content { background: #ffffff; padding: 30px; border-radius: 30px; border: 5px solid #5600FF; }
        button { background: #5600FF; color: white; font-weight: bold; padding: 12px 24px; border: none; border-radius: 40px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        button:hover { transform: scale(1.02); background: #3c00b3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .completed { color: green; font-weight: bold; margin-top: 15px; }
        .lessons-link { display: inline-block; margin-top: 20px; color: #5600FF; font-weight: bold; text-decoration: none; }
        hr { margin: 20px 0; border-color: #5600FF; }
        .code-block { background: #1e1e2f; color: #AEFF00; font-family: monospace; padding: 15px; border-radius: 20px; margin: 15px 0; white-space: pre-wrap; }
        .tip { background: #e6e6ff; padding: 10px; border-radius: 15px; margin: 10px 0; color: #330066; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🐍 Урок 4: Python — Шаг 2</h1></div>
    <div class="content" id="contentArea">
        <p>⚡ Загрузка...</p>
    </div>
</div>
<script>
    const BASE = 'https://maksimilianmuzycenko-tech.github.io/itfreegcs/';

    function loadUser() {
        const raw = sessionStorage.getItem('gcs_user');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    function loadProgress() {
        const raw = sessionStorage.getItem('gcs_progress');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    function saveProgress(progress) {
        sessionStorage.setItem('gcs_progress', JSON.stringify(progress));
    }

    function render() {
        const user = loadUser();
        if (!user) {
            window.location.href = BASE + 'vhod.html';
            return;
        }
        let progress = loadProgress();
        if (!progress) return;

        const userName = user.user || 'Гость';
        const step1Done = progress.steps?.card4h1 === 'yes';
        const stepDone = progress.steps?.card4h2 === 'yes';

        const contentDiv = document.getElementById('contentArea');

        if (!step1Done) {
            contentDiv.innerHTML = `
                <p>⚠️ Сначала нужно пройти <a href="${BASE}card4h1.html" class="lessons-link">Шаг 1</a>.</p>
                <a href="${BASE}lessons.html" class="lessons-link">← Вернуться к урокам</a>
            `;
            return;
        }

        if (stepDone) {
            contentDiv.innerHTML = `
                <p>👋 Привет, <strong>${escapeHtml(userName)}</strong>!</p>
                <p>🎉 Поздравляю! Ты полностью прошёл урок 4.</p>
                <p>Python установлен и первый код запущен. Теперь ты готов писать свои программы!</p>
                <hr>
                <a href="${BASE}lessons.html" class="lessons-link">← Вернуться к урокам</a>
            `;
            return;
        }

        contentDiv.innerHTML = `
            <p>👋 Привет, <strong>${escapeHtml(userName)}</strong>!</p>
            <p><strong>📥 Установка Python</strong></p>
            <ol style="margin-left: 20px; line-height: 1.6;">
                <li>Зайди на официальный сайт: <a href="https://www.python.org/downloads/" target="_blank">python.org/downloads</a></li>
                <li>Скачай последнюю версию Python</li>
                <li><strong>ВАЖНО:</strong> При установке НЕ ЗАБУДЬ поставить галочку <strong>"Add Python to PATH"</strong></li>
                <li>Нажми "Install Now" и дождись окончания установки</li>
            </ol>
            
            <p><strong>💻 Запуск первого кода</strong></p>
            <p>1. Открой командную строку (Win+R → cmd)</li>
            <p>2. Создай файл: <span class="code-block" style="display:inline-block; padding:5px 10px;">notepad hello.py</span></p>
            <p>3. Напиши в блокноте:</p>
            <div class="code-block">print("Hello, GCS!")</div>
            <p>4. Сохрани файл и в командной строке напиши:</p>
            <div class="code-block">python hello.py</div>
            
            <div class="tip">
                💡 <strong>Если всё правильно</strong> — увидишь: <strong>Hello, GCS!</strong>
            </div>
            
            <hr>
            <p><strong>🎯 Задание:</strong> Установи Python и запусти <code>hello.py</code>. Затем нажми кнопку ниже.</p>
            <button id="completeBtn">✅ Установил и запустил(а)!</button>
            <div id="completeMsg"></div>
        `;

        const btn = document.getElementById('completeBtn');
        const msgDiv = document.getElementById('completeMsg');

        btn.addEventListener('click', () => {
            if (!progress.steps) progress.steps = {};
            if (!progress.cards) progress.cards = {};

            progress.steps.card4h1 = 'yes';
            progress.steps.card4h2 = 'yes';
            progress.cards.card4 = 'win';
            progress.points = (progress.points || 0) + 1;

            saveProgress(progress);

            msgDiv.innerHTML = `
                <p class="completed">✅ Отлично! +1 балл. Урок 4 пройден!</p>
                <a href="${BASE}lessons.html" class="lessons-link">📚 Перейти к урокам →</a>
            `;
            btn.disabled = true;
            btn.style.opacity = '0.5';
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    render();
</script>
</body>
</html>
