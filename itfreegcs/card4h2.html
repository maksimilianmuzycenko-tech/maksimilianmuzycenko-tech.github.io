<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS — Урок 4: Python. Шаг 2</title>
    <style>
        * { margin: 0 auto; padding: 5px; box-sizing: border-box; }
        body { background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%); font-family: system-ui, sans-serif; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #5600FF; padding-bottom: 10px; margin-bottom: 20px; }
        .content { background: #ffffff; padding: 30px; border-radius: 30px; border: 5px solid #5600FF; }
        button { background: #5600FF; color: white; font-weight: bold; padding: 12px 24px; border: none; border-radius: 40px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        button:hover { transform: scale(1.02); background: #3c00b3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .completed { color: green; font-weight: bold; margin-top: 15px; }
        .lessons-link { display: inline-block; margin-top: 20px; color: #5600FF; font-weight: bold; text-decoration: none; }
        hr { margin: 20px 0; border-color: #5600FF; }
        .question { background: #f5f5ff; padding: 15px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #5600FF; }
        .question p { margin-bottom: 10px; }
        input { width: 100%; padding: 10px; border-radius: 20px; border: 2px solid #5600FF; margin-top: 10px; }
        .correct-answer { color: green; font-weight: bold; }
        .wrong-answer { color: red; }
        .score { font-size: 18px; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🐍 Урок 4: Python — Шаг 2</h1></div>
    <div class="content" id="contentArea">
        <p>⚡ Загрузка...</p>
    </div>
</div>
<script>
    const BASE = 'https://maksimilianmuzycenko-tech.github.io/itfreegcs/';

    function loadUser() {
        const raw = sessionStorage.getItem('gcs_user');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    function loadProgress() {
        const raw = sessionStorage.getItem('gcs_progress');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e) { return null; }
    }

    function saveProgress(progress) {
        sessionStorage.setItem('gcs_progress', JSON.stringify(progress));
    }

    function render() {
        const user = loadUser();
        if (!user) {
            window.location.href = BASE + 'vhod.html';
            return;
        }
        let progress = loadProgress();
        if (!progress) return;

        const userName = user.user || 'Гость';
        const step1Done = progress.steps?.card4h1 === 'yes';
        const stepDone = progress.steps?.card4h2 === 'yes';
        const cardWin = progress.cards?.card4 === 'win';

        const contentDiv = document.getElementById('contentArea');

        if (!step1Done) {
            contentDiv.innerHTML = `
                <p>⚠️ Сначала нужно пройти <a href="${BASE}card4h1.html" class="lessons-link">Шаг 1</a>.</p>
                <a href="${BASE}lessons.html" class="lessons-link">← Вернуться к урокам</a>
            `;
            return;
        }

        if (stepDone && cardWin) {
            contentDiv.innerHTML = `
                <p>👋 Привет, <strong>${escapeHtml(userName)}</strong>!</p>
                <p>🎉 Поздравляю! Ты полностью прошёл урок 4.</p>
                <p>Теперь ты знаешь основы Python: вывод, переменные, ввод и f-строки.</p>
                <hr>
                <a href="${BASE}lessons.html" class="lessons-link">← Вернуться к урокам</a>
            `;
            return;
        }

        // Вопросы и ответы
        const questions = [
            { text: "Какая команда выводит текст на экран?", answer: "print" },
            { text: "Как создать переменную с именем 'city' и значением 'Moscow'?", answer: "city = Moscow" },
            { text: "Что нужно написать, чтобы вывести f'Привет, {name}!'?", answer: "print(f\"Привет, {name}!\")" }
        ];

        let answers = {};

        function checkAll() {
            let allCorrect = true;
            for (let i = 0; i < questions.length; i++) {
                const userAnswer = (answers[i] || '').trim().toLowerCase().replace(/\s+/g, ' ');
                const correctAnswer = questions[i].answer.toLowerCase().replace(/\s+/g, ' ');
                if (userAnswer !== correctAnswer) {
                    allCorrect = false;
                    break;
                }
            }
            return allCorrect;
        }

        function renderQuestions() {
            let html = `<p>👋 Привет, <strong>${escapeHtml(userName)}</strong>!</p>
                        <p><strong>📝 Ответь на 3 вопроса:</strong></p>`;
            
            questions.forEach((q, idx) => {
                const savedAnswer = answers[idx] || '';
                html += `
                    <div class="question">
                        <p><strong>${idx+1}. ${q.text}</strong></p>
                        <input type="text" id="q${idx}" value="${escapeHtml(savedAnswer)}" placeholder="Введи ответ...">
                    </div>
                `;
            });
            
            html += `<button id="submitBtn">✅ Проверить ответы</button>
                     <div id="resultMsg"></div>`;
            
            contentDiv.innerHTML = html;
            
            // Сохраняем ответы при вводе
            for (let i = 0; i < questions.length; i++) {
                const input = document.getElementById(`q${i}`);
                input.addEventListener('input', (e) => {
                    answers[i] = e.target.value;
                });
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const resultMsg = document.getElementById('resultMsg');
            
            submitBtn.addEventListener('click', () => {
                // Обновляем ответы из полей
                for (let i = 0; i < questions.length; i++) {
                    const input = document.getElementById(`q${i}`);
                    answers[i] = input.value;
                }
                
                const allCorrect = checkAll();
                
                if (allCorrect) {
                    if (!progress.steps) progress.steps = {};
                    if (!progress.cards) progress.cards = {};
                    
                    progress.steps.card4h1 = 'yes';
                    progress.steps.card4h2 = 'yes';
                    progress.cards.card4 = 'win';
                    progress.points = (progress.points || 0) + 1;
                    
                    saveProgress(progress);
                    
                    resultMsg.innerHTML = `
                        <p class="completed">✅ Все ответы верны! +1 балл. Урок 4 пройден!</p>
                        <a href="${BASE}lessons.html" class="lessons-link">📚 Перейти к урокам →</a>
                    `;
                    submitBtn.disabled = true;
                } else {
                    resultMsg.innerHTML = '<p class="wrong-answer">❌ Не все ответы правильные. Попробуй ещё раз!</p>';
                }
            });
        }
        
        renderQuestions();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    render();
</script>
</body>
</html>
