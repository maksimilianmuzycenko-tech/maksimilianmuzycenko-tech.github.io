<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Информатика от GCS — Регистрация</title>
    <style>
        * {
            margin: 0 auto;
            padding: 5px;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 3px solid #5600FF;
            padding-bottom: 10px;
        }

        .card {
            display: flex;
            text-align: center;
            margin: 34px 0;
            flex-wrap: wrap;
            justify-content: center;
            gap: 19px;
        }

        .card a {
            flex: 1;
            background: #ffffff;
            color: #000000;
            padding: 16px 16px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 30px;
            transition: 1s;
            border: 5px solid #5600FF;
            margin-top: 20px;
            display: inline-block;
        }

        .card a:hover {
            transform: scale(1.08);
        }

        .text {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 30px;
            border: 5px solid #5600FF;
            margin-top: 20px;
            color: #000000;
            font-size: 18px;
            text-align: left;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #5600FF;
            border-radius: 40px;
            background: white;
            font-family: inherit;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #AEFF00;
            box-shadow: 0 0 0 3px rgba(86, 0, 255, 0.2);
        }

        input:disabled {
            background: #f0f0f0;
            color: #666;
        }

        button {
            background: #5600FF;
            color: white;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        button:hover {
            transform: scale(1.02);
            background: #3c00b3;
        }

        button:disabled {
            background: #aaa;
            transform: none;
            cursor: not-allowed;
        }

        .json-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #5600FF;
        }

        .json-box {
            background: #1e1e2f;
            color: #AEFF00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 16px;
            border-radius: 20px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #5600FF;
        }

        .copy-btn {
            background: #AEFF00;
            color: #000;
            margin-top: 12px;
            width: auto;
            padding: 8px 20px;
        }

        .copy-btn:hover {
            background: #9ae000;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #5600FF;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Регистрация</h1>
    </div>

    <div class="text">
        <div class="field">
            <label>👤 Придумайте имя (до 50 символов)</label>
            <input type="text" id="usernameInput" maxlength="50" placeholder="Например: Maximilian_12 или УченикGCS" autocomplete="off">
        </div>

        <button id="createBtn">✨ Создать аккаунт</button>

        <div id="jsonOutputArea" class="json-container" style="display: none;">
            <label>🔐 Ваш JSON-ключ (сохраните его):</label>
            <div class="json-box" id="jsonCode"></div>
            <button id="copyJsonBtn" class="copy-btn">📋 Копировать JSON</button>
            <p style="font-size: 14px; margin-top: 12px; color: #333;">⚠️ Без этого ключа вы не сможете войти в аккаунт. Храните его в надёжном месте.</p>
        </div>

        <a href="itfreegcs/index.html" class="back-link">← На главную</a>
    </div>
</div>

<script>
    const usernameInput = document.getElementById('usernameInput');
    const createBtn = document.getElementById('createBtn');
    const jsonOutputArea = document.getElementById('jsonOutputArea');
    const jsonCode = document.getElementById('jsonCode');
    const copyJsonBtn = document.getElementById('copyJsonBtn');

    createBtn.addEventListener('click', function() {
        let username = usernameInput.value.trim();

        if (username === '') {
            alert('Пожалуйста, введите имя пользователя.');
            return;
        }

        // Блокируем поле ввода и кнопку
        usernameInput.disabled = true;
        createBtn.disabled = true;

        // Создаём объект с JSON (только user)
        const userData = {
            user: username
        };

        // Форматируем JSON с отступами
        const jsonString = JSON.stringify(userData, null, 4);

        // Показываем блок с JSON и вставляем текст
        jsonCode.textContent = jsonString;
        jsonOutputArea.style.display = 'block';
    });

    // Копирование JSON в буфер обмена
    copyJsonBtn.addEventListener('click', function() {
        const textToCopy = jsonCode.textContent;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('✅ JSON скопирован в буфер обмена!');
        }).catch(() => {
            alert('❌ Не удалось скопировать. Скопируйте вручную.');
        });
    });
</script>
</body>
</html>
