<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <base href="/itfreegcs/">
    <title>GCS — Регистрация</title>
    <style>
        * { margin: 0 auto; padding: 5px; box-sizing: border-box; }
        body { background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%); font-family: system-ui, sans-serif; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #5600FF; padding-bottom: 10px; }
        .text { background: #ffffff; padding: 25px; border-radius: 30px; border: 5px solid #5600FF; margin-top: 20px; }
        input { width: 100%; padding: 12px; border: 2px solid #5600FF; border-radius: 40px; margin: 10px 0; font-size: 16px; }
        button { background: #5600FF; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 40px; font-size: 18px; cursor: pointer; width: 100%; }
        button:hover { background: #3c00b3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .json-box { background: #1e1e2f; color: #AEFF00; font-family: monospace; padding: 16px; border-radius: 20px; margin-top: 15px; white-space: pre-wrap; word-break: break-all; }
        .copy-btn { background: #AEFF00; color: #000; width: auto; margin-top: 10px; }
        .back-link { display: inline-block; margin-top: 20px; color: #5600FF; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>📝 Регистрация</h1></div>
    <div class="text">
        <input type="text" id="usernameInput" maxlength="50" placeholder="Имя пользователя" autocomplete="off">
        <button id="createBtn">✨ Создать аккаунт</button>
        <div id="jsonOutputArea" style="display:none; margin-top:20px;">
            <div class="json-box" id="jsonCode"></div>
            <button id="copyJsonBtn" class="copy-btn">📋 Копировать JSON</button>
            <p style="font-size:14px; margin-top:10px;">⚠️ Сохрани этот ключ! Без него не войти.</p>
        </div>
        <a href="index.html" class="back-link">← На главную</a>
    </div>
</div>
<script>
    const usernameInput = document.getElementById('usernameInput');
    const createBtn = document.getElementById('createBtn');
    const jsonOutputArea = document.getElementById('jsonOutputArea');
    const jsonCode = document.getElementById('jsonCode');
    const copyJsonBtn = document.getElementById('copyJsonBtn');

    createBtn.addEventListener('click', () => {
        let username = usernameInput.value.trim();
        if (!username) { alert('Введите имя'); return; }
        usernameInput.disabled = true;
        createBtn.disabled = true;
        const userData = { user: username };
        const jsonString = JSON.stringify(userData, null, 4);
        jsonCode.textContent = jsonString;
        jsonOutputArea.style.display = 'block';
    });

    copyJsonBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(jsonCode.textContent).then(() => alert('✅ JSON скопирован!'));
    });
</script>
</body>
</html>
