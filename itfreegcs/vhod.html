<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <base href="/itfreegcs/">
    <title>GCS — Вход</title>
    <style>
        * { margin: 0 auto; padding: 5px; box-sizing: border-box; }
        body { background: linear-gradient(60deg, #ffffff 0%, #AEFF00 100%); font-family: system-ui, sans-serif; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #5600FF; padding-bottom: 10px; }
        .text { background: #ffffff; padding: 25px; border-radius: 30px; border: 5px solid #5600FF; margin-top: 20px; }
        textarea { width: 100%; padding: 14px; font-family: monospace; border: 2px solid #5600FF; border-radius: 20px; margin: 15px 0; }
        button { background: #5600FF; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 40px; font-size: 18px; cursor: pointer; width: 100%; }
        button:hover { background: #3c00b3; }
        .success-btn { background: #AEFF00; color: #000; margin-top: 15px; }
        .error { color: red; margin-top: 12px; }
        .back-link { display: inline-block; margin-top: 20px; color: #5600FF; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🔐 Вход</h1></div>
    <div class="text">
        <textarea id="jsonInput" rows="6" placeholder='{"user":"Максим"}'></textarea>
        <button id="loginBtn">Войти</button>
        <div id="errorMsg" class="error"></div>
        <div id="successBlock"></div>
        <a href="index.html" class="back-link">← На главную</a>
    </div>
</div>
<script>
    const loginBtn = document.getElementById('loginBtn');
    const jsonInput = document.getElementById('jsonInput');
    const errorMsg = document.getElementById('errorMsg');
    const successBlock = document.getElementById('successBlock');

    loginBtn.addEventListener('click', () => {
        const rawJson = jsonInput.value.trim();
        if (!rawJson) { errorMsg.innerText = '❌ Вставьте JSON'; return; }
        try {
            const userData = JSON.parse(rawJson);
            if (!userData.user) throw new Error();
            sessionStorage.setItem('gcs_user', rawJson);
            errorMsg.innerText = '';
            successBlock.innerHTML = `
                <p style="color:green;">✅ Добро пожаловать, ${escapeHtml(userData.user)}!</p>
                <button id="goToLessons" class="success-btn">📖 К урокам →</button>
            `;
            document.getElementById('goToLessons').addEventListener('click', () => {
                window.location.href = 'lessons.html';
            });
        } catch(e) {
            errorMsg.innerText = '❌ Неверный JSON-ключ';
            successBlock.innerHTML = '';
        }
    });
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
</script>
</body>
</html>
