    <title>Game Command Studio</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(to bottom, #000000 0%, #a318fa 100%) no-repeat fixed;
            font-family: Arial;
            line-height: 1.5;
            color: #ffffff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 24px;
            border-bottom: 7px solid #ffffff;
            border-radius: 15px;
            background: linear-gradient(70deg, #ff0000 0%, #ff8c00 100%); 
            padding-bottom: 14px;
            transition: 1s;
        }
        .header:hover { background: linear-gradient(70deg, #ff0000 0%, #c971ff 100%); transform: scale(1.05); }
        .nav {
            display: flex;
            text-align: center;
            margin: 34px 0;
            flex-wrap: wrap;
            justify-content: center;
            gap: 19px;
        }
        .nav a {
            flex: 1;
            display: inline-block;
            background: linear-gradient(70deg, #ff0000 0%, #ff8c00 100%);
            color: white;
            padding: 16px 16px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 30px;
            transition: 1s;
        }
        .nav a:hover {
            background: linear-gradient(70deg, #ff0000 0%, #c971ff 100%);
            transform: scale(1.08);
        }
        .license {
            background: linear-gradient(90deg, #ff0000 0%, #ff8c00 100%);
            padding: 28px;
            border-radius: 16px;
            margin-top: 24px;
            transition: 1s;
        }
        .license h1 {
            font-size: 30px;
            margin-bottom: 19px;
        }
        .license h2 {
            font-size: 24px;
            margin: 24px 0 14px;
            color: #ffffff;
        }
        .license p {
            margin: 14px 0;
        }
        .license:hover { background: linear-gradient(90deg, #ff0000 0%, #c971ff 100%); transform: scale(1.017); }
        .author p { font-size: 19px; text-align: center; color: #ffffff; }
        @media (max-width: 768px) {
            .container { padding: 19px; }
            .header { font-size: 26px; }
            .nav a { padding: 14px 16px; font-size: 18px; }
           .license h1 { font-size: 24px; }
            .license h2 { font-size: 22px; }
            .license p { font-size: 18px; }
        }

        @media (max-width: 480px) {
        .container { padding: 14px; }
        .header { font-size: 22px; }
        .nav a { padding: 12px 14px; font-size: 16px; }
        .license { padding: 16px; }
        .license h1 { font-size: 22px; }
        .license h2 { font-size: 20px; }
        .license p { font-size: 16px; }
        }

<div class="container">
    <div class="header">Game Command Studio сайт времен недоступен</div>
